<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 124" width="104" height="124" role="img" aria-label="Kotlin">
  <title>Kotlin</title>
  <style>
    .icon{transform-box:fill-box;transform-origin:center;animation:idle 3.4s ease-in-out 0.35s infinite}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.4s ease-in-out 0.35s infinite}
    .ring{animation:glow 4s ease-in-out 0.35s infinite}
    @keyframes idle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.72);opacity:.18}}
    @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
    @media (prefers-reduced-motion:reduce){.icon,.shadow,.ring{animation:none}}
  </style>
  <rect x="6" y="6" width="92" height="92" rx="20" fill="#0d1117"/>
  <rect class="ring" x="6" y="6" width="92" height="92" rx="20" fill="none" stroke="#7F52FF" stroke-width="1.5"/>
  <ellipse class="shadow" cx="52" cy="84" rx="18" ry="3" fill="#7F52FF"/>
  <g transform="translate(28 24) scale(2)"><g class="icon"><path fill="#7F52FF" d="M24 24H0V0h24L12 12Z"/></g></g>
  <text x="52" y="117" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8b949e">Kotlin</text>
</svg>
