<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 124" width="104" height="124" role="img" aria-label="Notepad">
  <title>Notepad</title>
  <style>
    .icon{transform-box:fill-box;transform-origin:center;animation:float 3s ease-in-out 0.3s infinite}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3s ease-in-out 0.3s infinite}
    .ring{animation:glow 3s ease-in-out 0.3s infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.7);opacity:.16}}
    @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
    @media (prefers-reduced-motion:reduce){.icon,.shadow,.ring{animation:none}}
  </style>
  <rect x="6" y="6" width="92" height="92" rx="20" fill="#0d1117"/>
  <rect class="ring" x="6" y="6" width="92" height="92" rx="20" fill="none" stroke="#7DD3FC" stroke-width="1.5"/>
  <ellipse class="shadow" cx="52" cy="86" rx="18" ry="3" fill="#7DD3FC"/>
  <g transform="translate(28 26) scale(2)"><g class="icon"><g fill="none" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4" width="15" height="17.5" rx="2"/><path d="M8 2.2v3.6M12 2.2v3.6M16 2.2v3.6M8 10h8M8 13.5h8M8 17h5"/></g></g></g>
  <text x="52" y="117" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#8b949e">Notepad</text>
</svg>
