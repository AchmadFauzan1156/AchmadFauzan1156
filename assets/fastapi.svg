<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 124" width="104" height="124" role="img" aria-label="FastAPI">
  <title>FastAPI</title>
  <style>
    .icon{transform-box:fill-box;transform-origin:center;animation:float 3s ease-in-out 1.2s infinite}
