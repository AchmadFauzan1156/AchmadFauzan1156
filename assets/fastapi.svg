    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.7);opacity:.16}}
    @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
    @media (prefers-reduced-motion:reduce){.icon,.shadow,.ring{animation:none}}
  </style>
