<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 124" width="104" height="124" role="img" aria-label="Tailwind">
  <title>Tailwind</title>
  <style>
    .icon{transform-box:fill-box;transform-origin:center;animation:float 3s ease-in-out 0.6s infinite}
    .shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3s ease-in-out 0.6s infinite}
    .ring{animation:glow 3s ease-in-out 0.6s infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.7);opacity:.16}}
    @keyframes glow{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.9}}
    @media (prefers-reduced-motion:reduce){.icon,.shadow,.ring{animation:none}}
  </style>
  <rect x="6" y="6" width="92" height="92" rx="20" fill="#0d1117"/>
  <rect class="ring" x="6" y="6" width="92" height="92" rx="20" fill="none" stroke="#06B6D4" stroke-width="1.5"/>
